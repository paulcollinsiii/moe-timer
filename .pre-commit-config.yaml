default_stages: [pre-commit]

# Vendored third-party code (Unity test framework, cJSON) keeps upstream
# formatting and is exempt from our static analysis.
exclude: ^(test/unity/|lib/cJSON/)

repos:
  # ── Housekeeping & branch protection ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch, main]

  # ── C/C++ formatting ──────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (C/H files)
        language: system
        entry: clang-format --dry-run --Werror
        files: \.(c|h)$
        exclude: ^(build/|\.pio/)

  # ── Static analysis ───────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck static analysis
        language: system
        entry: cppcheck
        args:
          - --std=c11
          - --enable=warning,style
          - --suppressions-list=.cppcheck-suppressions
          - --error-exitcode=1
          - --inline-suppr
          - --quiet
        files: \.(c|h)$
        exclude: ^(build/|\.pio/)

  # ── Log-argument hazard (HAZ-1) ───────────────────────────────────────────────
  # ESP_LOGx wraps its ARGUMENTS in a compile-time level guard, so a call left
  # inside one stops executing entirely once the level is compiled out — on the
  # device, not only on host. Nothing else here can see that: the host log stubs
  # discard their varargs too, and the differential sweep compares two host
  # builds. The scanner carries the allowlist and the reasoning.
  - repo: local
    hooks:
      - id: no-calls-in-log-args
        name: no function calls in ESP_LOGx arguments
        language: script
        entry: scripts/check-log-args.py
        files: \.(c|h)$
        exclude: ^(build/|\.pio/)

  # ── The chore gate / timer pixel collision ────────────────────────────────────
  # status_led_show_timer_state() writes NP_STATE_PIXEL, which is also the chore
  # checklist's gate pixel, so the two painters collide. wake_flow.c funnels all
  # twelve of its status paints through one wrapper and keeps exactly one raw
  # call (inside that wrapper). Review reverted each site in turn and TEN of the
  # twelve survived the whole host suite, two of them the last LED paint before
  # sleep on a chore-reachable path. The scanner carries the reasoning.
  - repo: local
    hooks:
      - id: status-led-wrapper
        name: one status_led_show_timer_state() call in wake_flow.c
        language: script
        entry: scripts/check-status-led-wrapper.py
        files: ^main/wake_flow\.c$
        pass_filenames: false

  # ── Commit message format ─────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: conventional-commit-msg
        name: Conventional commit message
        language: script
        entry: scripts/check-commit-msg.sh
        stages: [commit-msg]
